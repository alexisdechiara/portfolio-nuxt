name: Build & deploy (Dokploy)

# L'image est construite ici (le prérendu Nuxt demande plus de 2 Go de RAM,
# trop pour le VPS qui héberge déjà d'autres services), poussée sur GHCR,
# puis Dokploy est notifié pour récupérer la nouvelle image.

on:
  push:
    branches: [main, 'ccr-*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NUXT_PUBLIC_SITE_URL=https://alexisdechiara.fr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Déclencher le déploiement Dokploy
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "::warning::Secret DOKPLOY_WEBHOOK_URL absent : déploiement Dokploy non déclenché."
            exit 0
          fi
          curl -fsS -X POST "$DOKPLOY_WEBHOOK_URL"
